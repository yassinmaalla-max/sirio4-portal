name: sirio4_portal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  firebase_database: ^10.5.7
  shared_preferences: ^2.2.2
  file_picker: ^8.3.7
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  wifi_iot: ^0.3.19
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"  # <--- Doit être ici, aligné avec flutter_test

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Configuration pour l'icône de l'application
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false 
  image_path: "assets/logo2.png"
